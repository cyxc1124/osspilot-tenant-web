server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container health probe (not a business API).
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
